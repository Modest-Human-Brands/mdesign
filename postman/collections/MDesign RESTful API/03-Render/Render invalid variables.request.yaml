$kind: http-request
description: >-
  Schema violations return 400 with data.errors[{field,message,code}].
url: '{{base_url}}/api/render'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "templateId": "business-card-v1",
      "variables": {
        "organization": {
          "contactEmail": "not-an-email"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", () => pm.response.to.have.status(400));
      pm.test("Reports the invalid field", () => pm.expect(pm.response.json().data.errors[0].field).to.eql("organization.contactEmail"));
order: 7000
