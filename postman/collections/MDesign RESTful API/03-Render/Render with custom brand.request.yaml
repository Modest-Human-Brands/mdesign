$kind: http-request
description: >-
  Passes an inline organisation (colours, font) instead of a preset id. Unknown fonts are fetched from Google Fonts and fall back to Exo2.
url: '{{base_url}}/api/render?dpi=1'
method: POST
queryParams:
  - key: dpi
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "templateId": "event-standee-v1",
      "variables": {
        "title": "Creators Summit",
        "organization": {
          "id": "acme",
          "name": "Acme Studios",
          "branding": {
            "color": {
              "primary": "#0F766E",
              "accent": "#F59E0B"
            },
            "font": "Poppins"
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
order: 6000
