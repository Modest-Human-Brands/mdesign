$kind: http-request
description: >-
  Only png, webp, jpeg (jpg), gif and svg are accepted.
url: '{{base_url}}/api/render?format=bmp'
method: POST
queryParams:
  - key: format
    value: 'bmp'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "templateId": "business-card-v1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", () => pm.response.to.have.status(400));
      pm.test("Reports the format field", () => pm.expect(pm.response.json().data.errors[0].field).to.eql("format"));
order: 8000
