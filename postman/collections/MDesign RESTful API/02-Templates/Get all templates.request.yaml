$kind: http-request
description: >-
  Template catalogue for the picker. Optional category filter (Collateral, Social, Stationery, Display).
url: '{{base_url}}/api/template'
method: GET
queryParams:
  - key: category
    value: 'Social'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Every template has an id, category and resolution", () => {
        const list = pm.response.json();
        pm.expect(list).to.be.an("array").that.is.not.empty;
        list.forEach((t) => {
          pm.expect(t).to.have.all.keys("id", "label", "shortLabel", "category", "description", "resolution", "sampleUrl");
          pm.expect(t.resolution.width).to.be.a("number");
        });
      });
order: 1000
