$kind: http-request
description: >-
  Template metadata and the JSON Schema of its variables (with x-section, x-order and x-widget hints for form builders).
url: '{{base_url}}/api/template/{{template_id}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns a JSON Schema", () => {
        const body = pm.response.json();
        pm.expect(body.id).to.eql(pm.collectionVariables.get("template_id"));
        pm.expect(body.schema.type).to.eql("object");
        pm.expect(body.schema.properties).to.have.property("person");
      });
order: 2000
