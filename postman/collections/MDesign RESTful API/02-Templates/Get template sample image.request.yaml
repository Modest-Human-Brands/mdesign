$kind: http-request
description: >-
  Neutral sample (unbranded organisation and Field Label tokens) as a PNG, for the template picker.
url: '{{base_url}}/api/template/{{template_id}}/sample.png'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Is a PNG", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("image/png"));
order: 3000
