$kind: http-request
description: >-
  Variant branded: the client's organisation colours, logo and font over Field Label tokens. Variants: sample, branded, filled.
url: '{{base_url}}/api/template/preview?draft=true'
method: POST
queryParams:
  - key: draft
    value: 'true'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "templateId": "brochure-v1",
      "variant": "branded",
      "organizationId": "modest-human-brands"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns a base64 PNG and the resolution", () => {
        const body = pm.response.json();
        pm.expect(body.imageBase64).to.match(/^data:image\/png;base64,/);
        pm.expect(body.resolution).to.include.keys("width", "height", "aspectRatio");
      });
order: 5000
