$kind: http-request
description: >-
  Strict preview (1x PNG as base64). Placeholders backfill missing fields; invalid input is a 400 with field errors.
url: '{{base_url}}/api/template/preview'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "templateId": "business-card-v1",
      "variant": "filled",
      "organizationId": "modest-human-brands",
      "variables": {
        "person": {
          "name": "Aarav Sharma",
          "title": "Creative Director"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns a base64 PNG and the resolution", () => {
        const body = pm.response.json();
        pm.expect(body.imageBase64).to.match(/^data:image\/png;base64,/);
        pm.expect(body.resolution).to.include.keys("width", "height", "aspectRatio");
      });
order: 4000
